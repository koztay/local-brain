name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LOCAL_BRAIN_HOME="$RUNNER_TEMP/lb-home" LOCAL_BRAIN_NO_CLAUDE_CLI=1
          git config --global user.email ci@example.com && git config --global user.name ci
          B="$PWD/target/debug/local-brain"
          cp -r src "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && git init -q && git add -A && git commit -qm init
          "$B" init --no-models
          "$B" learn --no-watch
          "$B" ask "where is Store defined" | grep -q "src/store.rs" || "$B" ask "where is Store defined" | grep -q "store.rs"
          "$B" doctor || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
