name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release from the selected branch, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # A tag push builds that tag; a manual run builds the selected commit and creates the tag.
  REF: ${{ github.event_name == 'push' && github.ref || github.sha }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing/notarization runs only when these repository secrets exist.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          ./target/${{ matrix.target }}/release/local-brain${ext} --version
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/local-brain"
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"

          # Import the Developer ID certificate into a throwaway keychain.
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in APPLE_CERTIFICATE_P12"
            exit 1
          fi

          # Hardened runtime + secure timestamp are required for notarization.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dv --verbose=2 "$BIN" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"

          # Notarize (a bare binary cannot be stapled; Gatekeeper checks the ticket online).
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
          if [ -n "${APPLE_API_KEY_ID:-}" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          elif [ -n "${APPLE_ID:-}" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "::warning::Binary is signed but not notarized: no notarization credentials configured"
            exit 0
          fi
          OUT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" --wait --timeout 30m --output-format json)"
          echo "$OUT"
          STATUS="$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true
            echo "::error::Notarization failed with status '$STATUS'"
            exit 1
          fi
          echo "Notarization accepted"
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp README.md LICENSE NOTICE target/${{ matrix.target }}/release/
          tar -C target/${{ matrix.target }}/release -czf dist/local-brain-${{ matrix.target }}.tar.gz local-brain README.md LICENSE NOTICE
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md, LICENSE, NOTICE target/${{ matrix.target }}/release/
          Compress-Archive -Path target/${{ matrix.target }}/release/local-brain.exe, target/${{ matrix.target }}/release/README.md, target/${{ matrix.target }}/release/LICENSE, target/${{ matrix.target }}/release/NOTICE -DestinationPath dist/local-brain-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: local-brain-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum local-brain-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF2'

          ## Install

          macOS / Linux:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/koztay/local-brain/main/install.sh | sh
          ```
          Windows (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/koztay/local-brain/main/install.ps1 | iex
          ```
          Or download an archive below and put `local-brain` on your PATH. Verify with `SHA256SUMS`.
          EOF2
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: local-brain ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/local-brain-*
            dist/SHA256SUMS

  homebrew:
    # Keep the tap formula in this repo pointing at the newest release, so `brew upgrade`
    # (and `local-brain update`) pick it up without a manual checksum edit.
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Formula/local-brain.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -p SHA256SUMS -O "$RUNNER_TEMP/SHA256SUMS"
          python3 scripts/update-formula.py "$TAG" "$RUNNER_TEMP/SHA256SUMS"
          if git diff --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Homebrew formula for $TAG"
          git push origin HEAD:main
